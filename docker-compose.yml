services:
  postgres:
    image: postgres:16-alpine
    container_name: rouby-salon-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rouby
      POSTGRES_PASSWORD: rouby
      POSTGRES_DB: rouby_salon
    volumes:
      - rouby_salon_pgdata:/var/lib/postgresql/data

volumes:
  rouby_salon_pgdata:
